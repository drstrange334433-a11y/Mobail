<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_speaker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow_speaker" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg_speaker)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  
  <!-- Portable Bluetooth Speaker -->
  <g filter="url(#shadow_speaker)" transform="translate(140, 75)">
    <!-- Top Cap -->
    <ellipse cx="60" cy="25" rx="55" ry="16" fill="#1e293b" />
    
    <!-- Speaker Cylinder Body -->
    <path d="M 5,25 L 5,195 A 55 16 0 0 0 115,195 L 115,25 Z" fill="#334155" stroke="#1e293b" stroke-width="2.5" />
    
    <!-- Bottom Cap -->
    <ellipse cx="60" cy="195" rx="55" ry="16" fill="#0f172a" />
    
    <!-- Speaker Mesh Grid Rows -->
    <g fill="#94a3b8" opacity="0.6">
      <!-- Dots pattern indicating speaker grille -->
      <circle cx="35" cy="70" r="2.5" /><circle cx="50" cy="70" r="2.5" /><circle cx="65" cy="70" r="2.5" /><circle cx="80" cy="70" r="2.5" />
      <circle cx="25" cy="85" r="2.5" /><circle cx="42" cy="85" r="2.5" /><circle cx="60" cy="85" r="2.5" /><circle cx="78" cy="85" r="2.5" /><circle cx="95" cy="85" r="2.5" />
      <circle cx="35" cy="100" r="2.5" /><circle cx="50" cy="100" r="2.5" /><circle cx="65" cy="100" r="2.5" /><circle cx="80" cy="100" r="2.5" />
      <circle cx="25" cy="115" r="2.5" /><circle cx="42" cy="115" r="2.5" /><circle cx="60" cy="115" r="2.5" /><circle cx="78" cy="115" r="2.5" /><circle cx="95" cy="115" r="2.5" />
      <circle cx="35" cy="130" r="2.5" /><circle cx="50" cy="130" r="2.5" /><circle cx="65" cy="130" r="2.5" /><circle cx="80" cy="130" r="2.5" />
      <circle cx="25" cy="145" r="2.5" /><circle cx="42" cy="145" r="2.5" /><circle cx="60" cy="145" r="2.5" /><circle cx="78" cy="145" r="2.5" /><circle cx="95" cy="145" r="2.5" />
    </g>

    <!-- Controls Strip -->
    <rect x="52" y="55" width="16" height="110" rx="8" fill="#0f172a" />
    <!-- Plus button -->
    <line x1="56" y1="75" x2="64" y2="75" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="60" y1="71" x2="60" y2="79" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Play button -->
    <polygon points="58,105 65,110 58,115" fill="#38bdf8" />
    <!-- Minus button -->
    <line x1="56" y1="145" x2="64" y2="145" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Lanyard Cord / Loop -->
    <path d="M 25,25 Q 5,-15 35,-15 Q 55,-15 45,20" fill="none" stroke="#f97316" stroke-width="4.5" stroke-linecap="round" />
  </g>
  <text x="200" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">
    BLUETOOTH SPEAKER
  </text>

  <!-- Translated Photo Coming Soon Badge -->
  <g transform="translate(60, 368)">
    <rect width="280" height="22" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="140" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">
      Photo coming soon • تصویر جلد دستیاب ہوگی
    </text>
  </g>
</svg>
