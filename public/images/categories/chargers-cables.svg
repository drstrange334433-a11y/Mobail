<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_chargers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow_chargers" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg_chargers)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  
  <!-- Charger Adapter + Cable Graphic -->
  <g filter="url(#shadow_chargers)">
    <!-- Wall Charger Body -->
    <g transform="translate(110, 80)">
      <!-- Prongs -->
      <rect x="30" y="0" width="10" height="25" rx="3" fill="#64748b" />
      <rect x="60" y="0" width="10" height="25" rx="3" fill="#64748b" />
      <!-- Adapter brick -->
      <rect x="10" y="22" width="80" height="95" rx="16" fill="#ffffff" stroke="#475569" stroke-width="2.5" />
      <!-- USB-C Port -->
      <rect x="36" y="92" width="28" height="10" rx="5" fill="#0f172a" />
      <rect x="42" y="95" width="16" height="4" rx="2" fill="#38bdf8" />
      <!-- Power Icon -->
      <polygon points="50,42 42,62 50,62 46,78 60,56 50,56" fill="#eab308" />
    </g>

    <!-- Braided Cable -->
    <path d="M 160 200 C 160 270, 260 270, 260 210 S 210 160, 240 130" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <!-- Connector Head -->
    <g transform="translate(235, 95)">
      <rect x="0" y="20" width="16" height="32" rx="5" fill="#ffffff" stroke="#475569" stroke-width="2" />
      <rect x="4" y="5" width="8" height="16" rx="2" fill="#94a3b8" />
      <!-- Type-C tip -->
      <rect x="3" y="0" width="10" height="6" rx="2" fill="#cbd5e1" />
    </g>
  </g>
  <text x="200" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">
    CHARGERS &amp; CABLES
  </text>

  <!-- Translated Photo Coming Soon Badge -->
  <g transform="translate(60, 368)">
    <rect width="280" height="22" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="140" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">
      Photo coming soon • تصویر جلد دستیاب ہوگی
    </text>
  </g>
</svg>
