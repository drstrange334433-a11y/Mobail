<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_smartphones" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="screen_smartphones" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.04" />
    </linearGradient>
    <filter id="shadow_smartphones" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg_smartphones)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  
  <!-- Smartphone Graphic -->
  <g filter="url(#shadow_smartphones)" transform="translate(130, 70)">
    <!-- Chassis -->
    <rect x="0" y="0" width="140" height="260" rx="26" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5" />
    <!-- Screen -->
    <rect x="7" y="9" width="126" height="242" rx="20" fill="url(#screen_smartphones)" />
    <!-- Punch-hole Camera -->
    <circle cx="70" cy="22" r="4.5" fill="#0f172a" />
    <circle cx="71" cy="21" r="1.5" fill="#38bdf8" />
    <!-- Speaker Earpiece -->
    <rect x="52" y="11" width="36" height="3" rx="1.5" fill="#64748b" />
    <!-- Screen graphic lines -->
    <rect x="22" y="70" width="96" height="56" rx="12" fill="#3b82f6" fill-opacity="0.1" />
    <circle cx="70" cy="98" r="16" fill="#3b82f6" fill-opacity="0.2" />
    <!-- Home bar -->
    <rect x="45" y="238" width="50" height="4" rx="2" fill="#64748b" />
  </g>
  <text x="200" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">
    SMARTPHONE
  </text>

  <!-- Translated Photo Coming Soon Badge -->
  <g transform="translate(60, 368)">
    <rect width="280" height="22" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="140" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">
      Photo coming soon • تصویر جلد دستیاب ہوگی
    </text>
  </g>
</svg>
