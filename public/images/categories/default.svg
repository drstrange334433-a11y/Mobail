<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow_default" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg_default)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  
  <!-- Generic Accessory Package / Item Graphic -->
  <g filter="url(#shadow_default)" transform="translate(130, 90)">
    <!-- Package box outline -->
    <rect x="0" y="0" width="140" height="150" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="2.5" />
    <!-- Box Flap Line -->
    <line x1="0" y1="45" x2="140" y2="45" stroke="#cbd5e1" stroke-width="2" />
    <!-- Center ribbon / seal -->
    <rect x="52" y="30" width="36" height="30" rx="6" fill="#3b82f6" />
    <!-- Device Sparkle icon -->
    <path d="M 70,35 Q 70,45 80,45 Q 70,45 70,55 Q 70,45 60,45 Q 70,45 70,35 Z" fill="#ffffff" />
    
    <!-- Geometric gadget silhouette -->
    <rect x="25" y="75" width="90" height="45" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="50" cy="97" r="12" fill="#3b82f6" fill-opacity="0.15" />
    <rect x="70" y="93" width="35" height="8" rx="4" fill="#94a3b8" />
  </g>
  <text x="200" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">
    PARACHA ACCESSORY
  </text>

  <!-- Translated Photo Coming Soon Badge -->
  <g transform="translate(60, 368)">
    <rect width="280" height="22" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="140" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">
      Photo coming soon • تصویر جلد دستیاب ہوگی
    </text>
  </g>
</svg>
