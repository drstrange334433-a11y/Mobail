<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_memory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow_memory" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg_memory)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  
  <!-- USB Flash Drive & MicroSD Graphic -->
  <g filter="url(#shadow_memory)">
    <!-- USB Drive Body -->
    <g transform="translate(100, 110)">
      <!-- USB Metal Plug -->
      <rect x="0" y="24" width="36" height="40" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
      <rect x="10" y="32" width="6" height="10" rx="1.5" fill="#475569" />
      <rect x="10" y="46" width="6" height="10" rx="1.5" fill="#475569" />
      <!-- Drive Casing -->
      <rect x="34" y="16" width="100" height="56" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2.5" />
      <!-- LED Dot -->
      <circle cx="120" cy="44" r="3.5" fill="#38bdf8" />
      <!-- Lanyard Hole -->
      <rect x="122" y="36" width="6" height="16" rx="3" fill="#334155" />
      <text x="75" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle">USB 3.0</text>
    </g>

    <!-- MicroSD Card Graphic -->
    <g transform="translate(205, 140)">
      <!-- Card silhouette -->
      <path d="M 0,10 L 0,80 A 6 6 0 0 0 6,86 L 54,86 A 6 6 0 0 0 60,80 L 60,18 L 52,18 L 48,10 L 44,10 L 42,0 L 6,0 A 6 6 0 0 0 0,6 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
      <!-- Gold Pins hint -->
      <rect x="8" y="4" width="5" height="12" rx="1.5" fill="#eab308" />
      <rect x="16" y="4" width="5" height="12" rx="1.5" fill="#eab308" />
      <rect x="24" y="4" width="5" height="12" rx="1.5" fill="#eab308" />
      <rect x="32" y="4" width="5" height="12" rx="1.5" fill="#eab308" />
      <!-- Text on card -->
      <text x="30" y="50" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">microSD</text>
      <text x="30" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#facc15" text-anchor="middle">XC I</text>
    </g>
  </g>
  <text x="200" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">
    STORAGE &amp; USB
  </text>

  <!-- Translated Photo Coming Soon Badge -->
  <g transform="translate(60, 368)">
    <rect width="280" height="22" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="140" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">
      Photo coming soon • تصویر جلد دستیاب ہوگی
    </text>
  </g>
</svg>
