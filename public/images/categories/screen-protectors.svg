<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_protectors" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="glass_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.15" />
    </linearGradient>
    <filter id="shadow_protectors" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg_protectors)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  
  <!-- Screen Protector Sheet -->
  <g filter="url(#shadow_protectors)" transform="translate(130, 65)">
    <!-- Base phone outline (faint) -->
    <rect x="-8" y="10" width="140" height="255" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" opacity="0.6" stroke-dasharray="5 5" />
    
    <!-- Tempered Glass Sheet hovering -->
    <rect x="8" y="-5" width="136" height="255" rx="22" fill="url(#glass_grad)" stroke="#0284c7" stroke-width="2.5" />
    <!-- Speaker slit -->
    <rect x="54" y="5" width="44" height="4" rx="2" fill="#0284c7" />
    <!-- Camera hole -->
    <circle cx="76" cy="18" r="4.5" fill="#0284c7" fill-opacity="0.4" stroke="#0284c7" stroke-width="1.5" />
    
    <!-- Glass reflection highlight stripe -->
    <polygon points="12,40 40,10 135,160 107,190" fill="#ffffff" fill-opacity="0.45" />

    <!-- 9H Hardness Badge -->
    <g transform="translate(46, 110)">
      <polygon points="30,0 58,15 58,45 30,60 2,45 2,15" fill="#0284c7" />
      <text x="30" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">9H</text>
      <text x="30" y="44" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#e0f2fe" text-anchor="middle">GLASS</text>
    </g>
  </g>
  <text x="200" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">
    SCREEN PROTECTOR
  </text>

  <!-- Translated Photo Coming Soon Badge -->
  <g transform="translate(60, 368)">
    <rect width="280" height="22" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="140" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">
      Photo coming soon • تصویر جلد دستیاب ہوگی
    </text>
  </g>
</svg>
