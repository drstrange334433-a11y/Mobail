<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cases" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow_cases" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg_cases)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  
  <!-- Phone Case Graphic -->
  <g filter="url(#shadow_cases)" transform="translate(130, 65)">
    <!-- Case outer bumper -->
    <rect x="0" y="0" width="140" height="260" rx="30" fill="#334155" stroke="#1e293b" stroke-width="3" />
    <!-- Case inner back texture -->
    <rect x="8" y="8" width="124" height="244" rx="22" fill="#475569" />
    <!-- Textured pattern / carbon-fiber weave hints -->
    <rect x="18" y="100" width="104" height="130" rx="14" fill="#1e293b" fill-opacity="0.3" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- Camera cutout bumper -->
    <rect x="16" y="20" width="56" height="64" rx="16" fill="#1e293b" stroke="#0f172a" stroke-width="2.5" />
    <!-- Camera lens rings -->
    <circle cx="34" cy="38" r="9" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <circle cx="34" cy="38" r="4" fill="#38bdf8" />
    <circle cx="34" cy="64" r="9" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <circle cx="34" cy="64" r="4" fill="#38bdf8" />
    <circle cx="56" cy="51" r="5" fill="#facc15" />
    
    <!-- Corner shock bumpers -->
    <rect x="2" y="2" width="16" height="16" rx="8" fill="#1e293b" />
    <rect x="122" y="2" width="16" height="16" rx="8" fill="#1e293b" />
    <rect x="2" y="242" width="16" height="16" rx="8" fill="#1e293b" />
    <rect x="122" y="242" width="16" height="16" rx="8" fill="#1e293b" />
  </g>
  <text x="200" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">
    CASES &amp; COVERS
  </text>

  <!-- Translated Photo Coming Soon Badge -->
  <g transform="translate(60, 368)">
    <rect width="280" height="22" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="140" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">
      Photo coming soon • تصویر جلد دستیاب ہوگی
    </text>
  </g>
</svg>
